apiVersion: 1

contactPoints:
  - orgId: 1
    name: "neuro-pipeline-webhook"
    receivers:
      - uid: "webhook-placeholder"
        type: webhook
        settings:
          url: "http://localhost:8000/api/v2/alerts/webhook"
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: "neuro-pipeline-webhook"
    group_by: ["alertname", "severity"]
    group_wait: "30s"
    group_interval: "5m"
    repeat_interval: "4h"
