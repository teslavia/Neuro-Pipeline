# Neuro-Pipeline Configuration
# =============================

edge:
  device_id: "edge-001"
  video_source: ""
  camera_device: "/dev/video0"
  model_path: "/opt/neuro-pipeline/models/yolov5s-640-640.rknn"
  width: 1920
  height: 1080
  model_width: 640
  model_height: 640
  fps: 30
  npu_core_mask: 0
  confidence_threshold: 0.5
  nms_threshold: 0.45
  max_frames: 0
  enable_grpc: true
  grpc_server: "192.168.1.100:50051"
  class_names_file: ""
  frame_skip_interval: 0  # 0 = send every frame, N = send every Nth frame
  grpc_compression: true  # Enable gzip compression for gRPC
  recording:
    enabled: false
    pre_seconds: 10
    post_seconds: 30
    output_dir: "/opt/neuro-pipeline/recordings"

  # v2 feature toggles
  enable_temporal_tracker: false
  enable_adaptive_fps: false
  enable_multi_model: false

  # Multi-model config (used when enable_multi_model: true)
  # models:
  #   - model_id: yolov5s
  #     model_path: /opt/neuro-pipeline/models/yolov5s-640-640.rknn
  #     postprocessor: yolov5
  #     npu_core: 0
  #   - model_id: yolov5m
  #     model_path: /opt/neuro-pipeline/models/yolov5m-640-640.rknn
  #     postprocessor: yolov5
  #     npu_core: 1
  #   - model_id: yolov8s
  #     model_path: /opt/neuro-pipeline/models/yolov8s-640-640.rknn
  #     postprocessor: yolov8
  #     npu_core: 2

central:
  host: "0.0.0.0"
  port: 50051
  model_path: "models/Llama-3.2-3B-Instruct-4bit-mlx"
  max_message_size_mb: 16
  vlm_model_path: ""  # e.g. "models/Qwen2-VL-2B-Instruct-4bit-mlx"
  inference_mode: "llm"  # "llm" or "vlm"

tls:
  enabled: false
  ca_cert: "certs/ca.pem"
  server_cert: "certs/server.pem"
  server_key: "certs/server-key.pem"

storage:
  db_path: "data/detections.db"
  retention_days: 7

vlm_rules:
  - class_name: "person"
    min_confidence: 0.8
    prompt_template: "person_behavior"
  - class_name: "car"
    min_confidence: 0.85
    prompt_template: "scene_analysis"
  - class_name: "fire"
    min_confidence: 0.6
    prompt_template: "anomaly_detection"

logging:
  level: "info"
  format: "text"
  trace_enabled: true
  file_path: "logs/central.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

metrics:
  enabled: true
  port: 9090

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 30.0
  half_open_max: 1

alerting:
  enabled: true
  webhook_url: ""
  routes:
    - severity: critical
      webhook_url: ""
    - severity: warning
      webhook_url: ""
  rules:
    - name: "circuit_breaker_open"
      cooldown_seconds: 300
    - name: "edge_disconnect"
      cooldown_seconds: 60
    - name: "anomaly_detection"
      cooldown_seconds: 30
    - name: "vlm_queue_full"
      cooldown_seconds: 60

tracing:
  enabled: false
  endpoint: "http://localhost:4317"
  service_name: "neuro-pipeline-central"
  sample_rate: 1.0

batch:
  max_size: 8
  timeout_seconds: 2.0
  enabled: true

sessions:
  heartbeat_interval: 10.0
  expiry_timeout: 30.0
  max_devices: 16

cloud_storage:
  enabled: false
  provider: "s3"
  bucket: ""
  prefix: "neuro-pipeline/"
  endpoint_url: ""
  region: "us-east-1"

rate_limiting:
  enabled: false
  max_rps: 100
  burst: 20

# v2: Model management
model_management:
  enabled: false
  max_models_per_device: 3

# v2: Multi-round reasoning chain
reasoning:
  enabled: false
  max_steps: 3
  timeout_per_step: 15.0

# v2: Adaptive frame rate (edge)
adaptive_fps:
  enabled: false
  min_fps: 5
  max_fps: 30
  idle_fps: 10
  active_fps: 30
  ramp_up_frames: 1
  ramp_down_frames: 90

# v2: RAG historical context
rag:
  enabled: false
  max_history_items: 10
  time_window_hours: 24.0

# v2: A/B model testing
ab_test:
  enabled: false
  traffic_split: 0.5
  min_samples: 100
  metric: "accuracy"

# v2: Anomaly baseline detection
anomaly:
  enabled: false
  baseline_window_hours: 168.0
  z_score_threshold: 3.0
  min_samples: 50
